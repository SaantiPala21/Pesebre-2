<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia de los Reyes Magos</title>
    <link rel="stylesheet" href="estrellas-fugaces.css">
    <style>
        body {
            background-color: #0b132b; /* Azul noche profundo */
            color: #f8db94; /* Color oro/estrella */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        /* Las estrellas pasan por detrás de la tarjeta */
        .estrellas-fugaces {
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
            box-sizing: border-box;
            width: 100%;
        }
        /* Círculo negro detrás del logo */
        .logo {
            background: #000;
            border-radius: 50%;
            width: 100%;
            max-width: 280px;
            aspect-ratio: 1 / 1;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.45);
        }
        .logo img {
            display: block;
            width: 90%;
            height: auto;
        }
        p {
            font-size: 1rem;
            margin-bottom: 30px;
            color: #d1d5db;
        }
        /* Bloque de redes sociales */
        .redes {
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid rgba(248, 219, 148, 0.25);
        }
        .redes h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f8db94;
            margin: 0 0 16px;
        }
        .redes-enlaces {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .redes-enlaces a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 999px;
            border: 1px solid rgba(248, 219, 148, 0.5);
            color: #f8db94;
            text-decoration: none;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .redes-enlaces a:hover,
        .redes-enlaces a:focus {
            background: rgba(248, 219, 148, 0.15);
        }
        .redes-enlaces svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        audio {
            width: 100%;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- Cielo de Belén: estrellas que titilan, Estrella de Belén y estrellas fugaces -->
    <div class="cielo-belen" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="estrella-belen" aria-hidden="true"></div>
    <div class="estrellas-fugaces" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="container">
        <div class="logo">
            <img src="logo.png" alt="A Soto Arte Religioso — Arte hecho pasión">
        </div>
        <p>Acerca tu celular para escuchar la historia</p>

        <!-- Asegúrate de que el nombre del archivo aquí sea igual al de tu audio -->
        <audio id="audio-historia" controls controlsList="nodownload" autoplay preload="auto">
            <source src="Audio%20pesebre%202.mpeg" type="audio/mpeg">
            Tu navegador no soporta el elemento de audio.
        </audio>

        <!-- Redes sociales -->
        <div class="redes">
            <h2>Síguenos en nuestras redes sociales</h2>
            <div class="redes-enlaces">
                <a href="https://www.instagram.com/asotoescultor/?hl=es-la" target="_blank" rel="noopener">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 1.2.1 1.8.2 2.2.4.6.2 1 .5 1.4.9.4.4.7.8.9 1.4.2.4.4 1 .4 2.2.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 1.2-.2 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .4-2.2.4-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-1.2-.1-1.8-.2-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8c.1-1.2.2-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2zm0 1.8c-3.1 0-3.5 0-4.7.1-1.1.1-1.7.2-2.1.4-.5.2-.9.4-1.3.8-.4.4-.6.8-.8 1.3-.2.4-.3 1-.4 2.1C2.6 9.9 2.6 10.3 2.6 12s0 3.5.1 4.7c.1 1.1.2 1.7.4 2.1.2.5.4.9.8 1.3.4.4.8.6 1.3.8.4.2 1 .3 2.1.4 1.2.1 1.6.1 4.7.1s3.5 0 4.7-.1c1.1-.1 1.7-.2 2.1-.4.5-.2.9-.4 1.3-.8.4-.4.6-.8.8-1.3.2-.4.3-1 .4-2.1.1-1.2.1-1.6.1-4.7s0-3.5-.1-4.7c-.1-1.1-.2-1.7-.4-2.1-.2-.5-.4-.9-.8-1.3-.4-.4-.8-.6-1.3-.8-.4-.2-1-.3-2.1-.4C15.5 4 15.1 4 12 4zm0 3.1a4.9 4.9 0 1 1 0 9.8 4.9 4.9 0 0 1 0-9.8zm0 8.1a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zm6.2-8.3a1.1 1.1 0 1 1-2.3 0 1.1 1.1 0 0 1 2.3 0z"/></svg>
                    Instagram
                </a>
                <a href="https://www.facebook.com/p/Alberto-Soto-Escultor-61567141080974/" target="_blank" rel="noopener">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg>
                    Facebook
                </a>
            </div>
        </div>
    </div>

    <script>
        var audio = document.getElementById('audio-historia');
        var mensaje = document.querySelector('.container p');

        // Al terminar el audio, redirige al Instagram de A Soto
        audio.addEventListener('ended', function () {
            window.location.replace('https://www.instagram.com/asotoescultor/?hl=es-la');
        });

        // Reproducción automática al abrir la página.
        // Si el navegador la bloquea, empieza con el primer toque en la pantalla.
        var eventos = ['click', 'touchend', 'keydown'];
        function quitarEscuchas() {
            eventos.forEach(function (e) { document.removeEventListener(e, alInteractuar); });
        }
        function alInteractuar() {
            quitarEscuchas();
            if (audio.paused) audio.play().catch(function () {});
        }
        audio.addEventListener('play', function () {
            quitarEscuchas();
            mensaje.textContent = 'Acerca tu celular para escuchar la historia';
        });

        var intento = audio.play();
        if (intento !== undefined) {
            intento.catch(function () {
                mensaje.textContent = 'Toca la pantalla para escuchar la historia';
                eventos.forEach(function (e) { document.addEventListener(e, alInteractuar); });
            });
        }
    </script>

</body>
</html>
